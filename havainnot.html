<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ilves P2018 – Havainnot</title>
<style>
  :root {
    --yellow: #F5B000;
    --green: #0A5C2F;
    --red: #C0392B;
    --grey: #888;
    --line: #ddd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #fff;
    color: #222;
    padding-bottom: 90px;
  }
  header {
    background: var(--yellow);
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  header input[type="date"] {
    border: none;
    background: rgba(255,255,255,.85);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 14px;
  }
  .hint {
    font-size: 12px;
    color: var(--grey);
    padding: 10px 16px 4px;
  }
  .player {
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
  }
  .row1 {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .name {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .name small { color: var(--grey); font-weight: 400; }
  .cell {
    width: 52px;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fafafa;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    color: #bbb;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .cell span.lbl { font-size: 9px; font-weight: 600; color: var(--grey); letter-spacing: .5px; }
  .cell span.val { line-height: 1; }
  .cell.plus  { background: #e8f5ec; border-color: var(--green); }
  .cell.plus .val { color: var(--green); }
  .cell.minus { background: #fdeeec; border-color: var(--red); }
  .cell.minus .val { color: var(--red); }
  .cell.mark  { background: #fff6df; border-color: var(--yellow); }
  .cell.mark .val { color: #b07f00; }
  .notebtn {
    width: 44px;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fafafa;
    font-size: 18px;
    cursor: pointer;
  }
  .notebtn.has { background: #fff6df; border-color: var(--yellow); }
  .note {
    display: none;
    margin-top: 8px;
  }
  .note.open { display: block; }
  .note textarea {
    width: 100%;
    min-height: 60px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    font-family: inherit;
    font-size: 14px;
  }
  .general {
    padding: 14px 16px;
  }
  .general h2 { font-size: 15px; margin-bottom: 6px; }
  .general textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    font-family: inherit;
    font-size: 14px;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  footer button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #share { background: var(--green); color: #fff; }
  #reset { background: #eee; color: #555; flex: 0 0 90px; }
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>Ilves P2018 – Havainnot</h1>
  <input type="date" id="pvm">
</header>

<div class="hint">Napauta ruutua: tyhjä → + → − → ! → tyhjä. 📝 avaa muistiinpanot. Tiedot säilyvät puhelimessa automaattisesti.</div>

<div id="players"></div>

<div class="general">
  <h2>Yleiset huomiot</h2>
  <textarea id="yleiset" placeholder="Yleiset huomiot..."></textarea>
</div>

<footer>
  <button id="share">Jaa yhteenveto</button>
  <button id="reset">Tyhjennä</button>
</footer>

<div class="toast" id="toast"></div>

<script>
const NAMES = [
  "Aalto Edvin","Al-Musawi Adam","Aro Joel","Hurske Eeli","Innanen Eino",
  "Irmak Mete","Konttinen Viljo","Koskela Joonatan","Kuorikoski Wilhelm",
  "Kytökorpi Kevin","Laitinen Rasmus","Lehtinen Altti","Leppäkoski Julius",
  "Lindroos Max Alexander","Lovén Elmo","Melander Aaron","Muranen Onni",
  "Mäkinen Markus","Nikkhouyabgarm Atila","Niyokwizerwa Gad","Räihä Kasper-veli",
  "Saarimäki Valo","Saresvaara Thomas","Soukkala Alvari","Tuohinen Roope","Ulmanen Hugo"
];
// Näytetään vain etunimi (kaikki sukunimen jälkeiset osat), lista etunimen mukaan aakkosissa
const DISPLAY = NAMES.map(n => ({ full: n, first: n.split(" ").slice(1).join(" ") }))
                     .sort((a, b) => a.first.localeCompare(b.first, "fi"));
const CATS = [["T","TEKN."],["L","LIIKUN."],["A","ASENNE"]];
const STATES = ["", "+", "-", "!"];
const CLASSMAP = { "+":"plus", "-":"minus", "!":"mark" };
const KEY = "ilves-havainnot";

let data = load();

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.players) return d;
  } catch(e) {}
  return { pvm: new Date().toISOString().slice(0,10), yleiset: "", players: {} };
}
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
function p(name) {
  if (!data.players[name]) data.players[name] = { T:"", L:"", A:"", note:"" };
  return data.players[name];
}

const wrap = document.getElementById("players");
DISPLAY.forEach(({ full: name, first }) => {
  const pl = p(name);
  const div = document.createElement("div");
  div.className = "player";

  const row = document.createElement("div");
  row.className = "row1";

  const nm = document.createElement("div");
  nm.className = "name";
  nm.textContent = first;
  row.appendChild(nm);

  CATS.forEach(([k, lbl]) => {
    const c = document.createElement("div");
    c.className = "cell";
    c.innerHTML = `<span class="lbl">${k}</span><span class="val">&nbsp;</span>`;
    const render = () => {
      const v = pl[k];
      c.className = "cell" + (v ? " " + CLASSMAP[v] : "");
      c.querySelector(".val").innerHTML = v || "&nbsp;";
    };
    c.onclick = () => {
      pl[k] = STATES[(STATES.indexOf(pl[k]) + 1) % 4];
      render(); save();
    };
    render();
    row.appendChild(c);
  });

  const nb = document.createElement("button");
  nb.className = "notebtn" + (pl.note ? " has" : "");
  nb.textContent = "📝";
  row.appendChild(nb);
  div.appendChild(row);

  const noteDiv = document.createElement("div");
  noteDiv.className = "note";
  const ta = document.createElement("textarea");
  ta.placeholder = "Muistiinpanot: " + first;
  ta.value = pl.note;
  ta.oninput = () => {
    pl.note = ta.value;
    nb.classList.toggle("has", !!ta.value.trim());
    save();
  };
  noteDiv.appendChild(ta);
  div.appendChild(noteDiv);

  nb.onclick = () => {
    noteDiv.classList.toggle("open");
    if (noteDiv.classList.contains("open")) ta.focus();
  };

  wrap.appendChild(div);
});

const pvmEl = document.getElementById("pvm");
pvmEl.value = data.pvm;
pvmEl.onchange = () => { data.pvm = pvmEl.value; save(); };

const ylEl = document.getElementById("yleiset");
ylEl.value = data.yleiset;
ylEl.oninput = () => { data.yleiset = ylEl.value; save(); };

function summary() {
  const d = data.pvm ? data.pvm.split("-").reverse().join(".") : "";
  let out = "Ilves P2018 avoimet harjoitukset, havainnot " + d + "\n";
  out += "(+ hyvä, - heikko, ! huomio seuraavaan kertaan)\n\n";
  NAMES.forEach(name => {
    const pl = data.players[name] || {};
    const marks = CATS.map(([k,lbl]) => (pl[k] ? lbl + " " + pl[k] : "")).filter(Boolean).join(", ");
    const note = (pl.note || "").trim();
    if (marks || note) {
      out += name + (marks ? ": " + marks : "") + (note ? " | " + note : "") + "\n";
    }
  });
  if (data.yleiset.trim()) out += "\nYleiset huomiot:\n" + data.yleiset.trim() + "\n";
  return out;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

document.getElementById("share").onclick = async () => {
  const text = summary();
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch(e) {}
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("Kopioitu leikepöydälle");
  } catch(e) {
    prompt("Kopioi yhteenveto:", text);
  }
};

document.getElementById("reset").onclick = () => {
  if (confirm("Tyhjennetäänkö kaikki merkinnät?")) {
    data = { pvm: new Date().toISOString().slice(0,10), yleiset: "", players: {} };
    save();
    location.reload();
  }
};
</script>
</body>
</html>
