    .pe-name { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .pe-venue { font-weight: 400; color: var(--text-dim); font-size: 12px; }
    .pe-detail { font-size: 12px; color: var(--text-body); margin-top: 2px; }
    .pe-footer { margin-top: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pe-count { font-size: 12px; color: var(--text-dim); }
    .pe-footer .cal-export-btn { margin-left: auto; }
